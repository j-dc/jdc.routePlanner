http:
  routers:
    address-review-web:
      entryPoints:
        - web
      rule: Host(`routing.localtest.me`)
      service: address-review-web
    address-review-api:
      entryPoints:
        - web
      rule: Host(`routing-api.localtest.me`)
      service: address-review-api
  services:
    address-review-web:
      loadBalancer:
        servers:
          - url: http://review-web:8080
    address-review-api:
      loadBalancer:
        servers:
          - url: http://review-api:8080