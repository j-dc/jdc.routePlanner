name: jdc-route-planner

services:
  powershell-base:
    image: jdc-route-planner/powershell-base:7.7.0-alpine-3.24.4
    build:
      context: .
      dockerfile: containers/powershell/Dockerfile

  photon:
    build:
      context: .
      dockerfile: containers/photon/Dockerfile
    command: ["serve"]
    working_dir: /geocoder/current
    environment:
      HOME: /tmp
      PHOTON_DATA_ROOT: /geocoder
      POWERSHELL_TELEMETRY_OPTOUT: "1"
    volumes:
      - type: bind
        source: ${GEOCODER_DATA_DIR:-../jdc.routePlanner-private-data/geocoder}
        target: /geocoder
    expose:
      - "2322"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:2322/status > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  check-addresses:
    build:
      context: .
      dockerfile: containers/check-addresses/Dockerfile
    depends_on:
      photon:
        condition: service_healthy
    environment:
      CHECK_ADDRESSES_INPUT: /private/input/ritten.csv
      CHECK_ADDRESSES_REPORT: /private/output/address-check.json
      CHECK_ADDRESSES_VERSION_FILE: /jobs/version
      GEOCODER_BASE_URL: http://photon:2322/api/
      HOME: /tmp
      POWERSHELL_TELEMETRY_OPTOUT: "1"
    volumes:
      - type: bind
        source: ${INPUT_DATA_DIR:-../jdc.routePlanner-private-data/input}
        target: /private/input
        read_only: true
      - type: bind
        source: ${OUTPUT_DATA_DIR:-../jdc.routePlanner-private-data/output}
        target: /private/output
      - type: volume
        source: address-check-jobs
        target: /jobs
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  extract-osm-geometry:
    build:
      context: .
      dockerfile: containers/extract-osm-geometry/Dockerfile
    environment:
      CHECK_ADDRESSES_VERSION_FILE: /jobs/geometry-version
      GEOMETRY_REPORT_DIR: /source
      GEOMETRY_OUTPUT_DIR: /output
      GEOMETRY_INPUT_DIR: /input
      GEOMETRY_REVIEW_DIR: /review
      GEOMETRY_SETTINGS_DIR: /source
      OSM_PBF_PATH: /osm/belgium-latest.osm.pbf
    volumes:
      - type: bind
        source: ${OSM_DATA_DIR:-../jdc.routePlanner-private-data/osm}
        target: /osm
        read_only: true
      - type: bind
        source: ${OUTPUT_DATA_DIR:-../jdc.routePlanner-private-data/output}
        target: /source
        read_only: true
      - type: bind
        source: ${OUTPUT_DATA_DIR:-../jdc.routePlanner-private-data/output}
        target: /output
      - type: bind
        source: ${INPUT_DATA_DIR:-../jdc.routePlanner-private-data/input}
        target: /input
        read_only: true
      - type: volume
        source: review-data
        target: /review
        read_only: true
      - type: volume
        source: address-check-jobs
        target: /jobs
        read_only: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.3
    # Bypasses the scripted entrypoint, which writes to the data directory and may download files.
    entrypoint: ["valhalla_service", "/custom_files/valhalla.json", "4"]
    command: []
    volumes:
      - type: bind
        source: ${VALHALLA_DATA_DIR:-../jdc.routePlanner-private-data/valhalla}
        target: /custom_files
        read_only: true
    expose:
      - "8002"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8002/status > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  traefik:
    image: traefik:3.7.19
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --providers.file.watch=true
      - --entrypoints.web.address=:8000
      - --entrypoints.browser.address=:80
      - --api.dashboard=false
      - --accesslog=false
      - --log.level=INFO
      - --ping=true
    ports:
      - target: 8000
        published: "80"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - type: bind
        source: ./containers/proxy/dynamic.yaml
        target: /etc/traefik/dynamic.yaml
        read_only: true
    depends_on:
      - routeplanner-ui
      - routeplanner-api
    networks:
      default:
        aliases:
          - routing.localtest.me
          - routing-api.localtest.me
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  routeplanner-ui:
    build:
      context: .
      dockerfile: apps/routeplanner-ui/Dockerfile
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  address-check-broker:
    image: jdc-route-planner-routeplanner-api
    command: ["--address-check-broker"]
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: volume
        source: address-check-jobs
        target: /jobs
    networks:
      - orchestration
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  render-route-maps:
    build:
      context: .
      dockerfile: containers/render-route-maps/Dockerfile
    volumes:
      - type: bind
        source: ${OUTPUT_DATA_DIR:-../jdc.routePlanner-private-data/output}
        target: /output
      - type: volume
        source: address-check-jobs
        target: /jobs
        read_only: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  matrix-worker:
    image: jdc-route-planner-routeplanner-api
    command: ["--matrix-worker"]
    environment:
      Matrix__OutputDirectory: /output
      Matrix__ValhallaUrl: http://valhalla:8002/
      Matrix__ApiUrl: http://routeplanner-api:8080/
    volumes:
      - type: bind
        source: ${OUTPUT_DATA_DIR:-../jdc.routePlanner-private-data/output}
        target: /output
    expose:
      - "8082"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  vroom-worker:
    build:
      context: .
      dockerfile: containers/vroom-worker/Dockerfile
    environment:
      ROUTE_OUTPUT_DIR: /output
      ROUTE_API_URL: http://routeplanner-api:8080/
      ROUTE_VALHALLA_URL: http://valhalla:8002/
    volumes:
      - type: bind
        source: ${OUTPUT_DATA_DIR:-../jdc.routePlanner-private-data/output}
        target: /output
    expose:
      - "8083"
    networks:
      - default
      - route-planning
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  driver-pdf:
    build:
      context: .
      dockerfile: containers/driver-pdf/Dockerfile
    environment:
      DRIVER_PDF_API_URL: http://routeplanner-api:8080/
      DRIVER_PDF_OUTPUT_DIR: /output
    volumes:
      - type: bind
        source: ${OUTPUT_DATA_DIR:-../jdc.routePlanner-private-data/output}
        target: /output
    expose:
      - "8084"
    networks:
      - route-planning
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  routeplanner-api:
    build:
      context: .
      dockerfile: containers/routeplanner-api/Dockerfile
    environment:
      Review__SourceReportPath: /source/address-check.json
      Review__InputCsvPath: /input/ritten.csv
      Review__ReviewFilePath: /review/address-review.json
      AddressCheck__BrokerUrl: http://address-check-broker:8081/
    volumes:
      - type: bind
        source: ${OUTPUT_DATA_DIR:-../jdc.routePlanner-private-data/output}
        target: /source
      - type: bind
        source: ${INPUT_DATA_DIR:-../jdc.routePlanner-private-data/input}
        target: /input
      - type: volume
        source: review-data
        target: /review
    expose:
      - "8080"
    depends_on:
      - address-check-broker
      - matrix-worker
      - vroom-worker
      - driver-pdf
    networks:
      - default
      - orchestration
      - route-planning
    healthcheck:
      test: ["CMD", "dotnet", "RoutePlanner.Api.dll", "--health-check"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  address-check-jobs:
  review-data:
    external: true
    name: jdc-route-planner-review-data

networks:
  orchestration:
    internal: true
  route-planning:
    internal: true